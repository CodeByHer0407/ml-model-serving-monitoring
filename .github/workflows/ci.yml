name: CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]


jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v


  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build -t ml-model-serving-monitoring:test .

  security:
    name: SBOM and Vulnerability Scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ml-model-serving-monitoring:scan \
            .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ml-model-serving-monitoring:scan
          format: spdx-json
          artifact-name: ml-serving-sbom.spdx.json

      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: ml-model-serving-monitoring:scan
          fail-build: false
          severity-cutoff: high
          output-format: table